        <script>
        /* Disclaimer Cookie überprüfen und ggf. weiterleiten */
        const DISCLAIMER_COOKIE_NAME = 'disclaimer_accepted';
        const DISCLAIMER_REDIRECT = 'disclaimer_abgabe.html';

        function getCookie(name) {
          const value = `; ${document.cookie}`;
          const parts = value.split(`; ${name}=`);
          if (parts.length === 2) return parts.pop().split(';').shift();
          return null;
        }

        function getLocalStorageAcceptance(name) {
          try {
            const raw = localStorage.getItem(name);
            if (!raw) return false;
            const data = JSON.parse(raw);
            return data && data.value === 'true' && data.expires && Date.now() < data.expires;
          } catch (e) {
            return false;
          }
        }

        function isDisclaimerAccepted() {
          if (getCookie(DISCLAIMER_COOKIE_NAME) === 'true') return true;
          return getLocalStorageAcceptance(DISCLAIMER_COOKIE_NAME);
        }

        if (!isDisclaimerAccepted()) {
          window.location.replace(DISCLAIMER_REDIRECT);
        }
        </script>
